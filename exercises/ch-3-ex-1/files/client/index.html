<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAuth Client</title>
  <link rel="stylesheet" href="/assets/common.css">
  <script src="/assets/common.js" defer></script>
</head>
<body class="client">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">OAuth in Action</a>
      <span class="service-label">Client - localhost:9000</span>
    </div>
  </header>
  <main>
    <p class="visually-hidden" data-copy-status aria-live="polite"></p>
    <section class="panel">
      <h1>OAuth Client</h1>
      <dl>
        <dt>Access token</dt>
        <dd>
          {% if access_token %}
            <span class="copyable-inline" data-copy-container>
              <span class="token" data-copy-value>{{ access_token }}</span>
              <button class="copy-button" type="button" data-copy-button
                aria-label="Copy access token" title="Copy access token">
                <span class="copy-icon" aria-hidden="true"></span>
              </button>
            </span>
          {% else %}
            <span class="token value-missing">NONE</span>
          {% endif %}
        </dd>
      </dl>
      <div class="actions">
        <a class="button button-primary" href="/authorize">
          Get an access token
        </a>
      </div>
    </section>
  </main>
</body>
</html>
